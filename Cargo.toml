[package]
name = "clair3"
version = "2.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "BSD-3-Clause"
description = "Rust implementation of the Clair3 variant caller"

[features]
default = ["distributed", "download-libtorch", "tf-checkpoint"]
distributed = []
cuda = ["distributed"]
download-libtorch = ["tch/download-libtorch"]
tf-checkpoint = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
libc = "0.2"
ndarray = "0.16.1"
npyz = "0.9.1"
rayon = "1.11"
regex = "1.12"
rust-htslib = "1.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tch = "0.26.0"
zstd = "0.13"
half = "2.7"
zip = "0.6.6"
hdf5-metno = { version = "0.15.0", features = ["static", "blosc-lz4", "lzf", "zlib"] }

[build-dependencies]
cc = "1.10"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
torch-sys = { path = "third_party/torch-sys" }
